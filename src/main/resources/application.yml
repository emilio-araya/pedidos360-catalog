server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: ms-pedidos360-catalog
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # Un resultado sin cola destino vuelve como returned y se trata como fallo.
      mandatory: true
    listener:
      simple:
        # Ack manual: ResilientConsumer confirma sólo después de procesar.
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  kafka:
    # SPRING_KAFKA_BOOTSTRAP_SERVERS lo sobreescribe (por ejemplo `kafka:9092` en infra).
    bootstrap-servers: localhost:9092
    consumer:
      # El grupo real lo fija el @KafkaListener (catalog-sales-projection).
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      # Sólo publica en la DLT; acks=all para no perder un evento rechazado.
      acks: all

app:
  kafka:
    sales-projection:
      # Arranca el consumidor de `pedidos360.order-events`.
      enabled: ${KAFKA_SALES_PROJECTION_ENABLED:true}
      retry:
        max-retries: 4
        initial-interval-ms: 1000
        max-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

logging:
  pattern:
    # %X{requestId} imprime el id de correlación; "-" cuando no hay request en curso.
    level: "%5p [%X{requestId:--}]"
