server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: ms-pedidos360-catalog
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

logging:
  pattern:
    # %X{requestId} imprime el id de correlación; "-" cuando no hay request en curso.
    level: "%5p [%X{requestId:--}]"
